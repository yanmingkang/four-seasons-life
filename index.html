<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f4ed" />
  <meta name="description" content="和刘看山一起走过四季。掷一颗骰子，在真实生活经验启发的事件中，做出自己的选择。" />
  <title>四时人生 · 刘看山的生活大富翁</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232b6655'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40' fill='white'%3E四%3C/text%3E%3C/svg%3E" />
  <style>
    /* Kept inside HTML so a failed game bundle can still explain itself. */
    #boot-screen{position:fixed;inset:0;z-index:30000;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#eeeada;color:#4b503e;font:16px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    #boot-screen[hidden]{display:none!important}
    #boot-screen .boot-card{width:min(390px,calc(100vw - 72px));padding:30px 25px;text-align:center;background:#fff7df;border:3px solid #8d704a;box-shadow:5px 5px 0 #c9b78d;box-sizing:border-box}
    #boot-screen .boot-sprout{display:block;width:32px;height:31px;margin:0 auto 17px;border-bottom:4px solid #977b4d;position:relative}
    #boot-screen .boot-sprout:before{content:"";position:absolute;left:15px;top:10px;width:4px;height:21px;background:#5f8051}
    #boot-screen .boot-sprout:after{content:"";position:absolute;left:4px;top:4px;width:13px;height:10px;background:#93b462;box-shadow:12px -4px 0 #6d9655}
    #boot-screen h1{font-size:23px;line-height:1.4;margin:0 0 12px;color:#355b46;letter-spacing:1px}
    #boot-screen p{font-size:14px;margin:8px 0 0}
    #boot-screen .boot-note{font-size:12px;color:#847b66;margin-top:18px}
    #boot-screen #boot-retry{display:inline-block;text-decoration:none;margin-top:20px;padding:10px 24px;border:2px solid #365c43;border-radius:3px;background:#4b7853;color:#fff9e6;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #365c43}
    #boot-screen #boot-retry[hidden]{display:none}
    #boot-screen #boot-retry:focus-visible{outline:3px solid #c58e45;outline-offset:5px}
    #boot-screen #boot-retry:disabled{opacity:.65;cursor:wait}
    @media(max-height:420px){#boot-screen .boot-card{padding:16px 22px}#boot-screen .boot-sprout{margin-bottom:9px}#boot-screen h1{font-size:20px}#boot-screen #boot-retry{margin-top:12px}}
  </style>
</head>
<body>
  <div id="app" inert aria-busy="true"></div>
  <section id="boot-screen" data-state="loading" role="status" aria-live="polite" aria-label="游戏启动状态">
    <div class="boot-card">
      <i class="boot-sprout" aria-hidden="true"></i>
      <h1 id="boot-title">正在打开四时人生</h1>
      <p id="boot-detail">小镇正在准备第一段旅程，请稍等片刻。</p>
      <a id="boot-retry" href="/">重新加载</a>
      <p class="boot-note">重试不会清除本机存档，也不会自动开始游戏。</p>
      <noscript><p>浏览器没有启用 JavaScript。请允许本网站运行 JavaScript 后，再刷新页面。</p></noscript>
    </div>
  </section>
  <script src="/boot-watchdog.js"></script>
  <script type="module" src="/src/boot-entry.js"></script>
</body>
</html>
